<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <title>{% block title %}Photo Frame{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/base.css">
  {% block styles %}{% endblock %}
  <style>
    /* Prevent flash of unstyled content */
    body { opacity: 0; transition: opacity 0.3s; }
    body.ready { opacity: 1; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}

  <script>
    // Mark body ready after first paint
    requestAnimationFrame(() => document.body.classList.add('ready'));
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
