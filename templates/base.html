<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <title>{% block title %}Photo Frame{% endblock %}</title>
  <script>
    // 키오스크(?kiosk=1)로 접속한 화면만 세로 회전(html.kiosk-rotate)을 적용한다.
    (function () {
      var params = new URLSearchParams(location.search);
      if (params.get('kiosk') === '1') localStorage.setItem('kiosk', '1');
      var rotated = localStorage.getItem('kiosk') === '1';
      if (!rotated) return;
      document.documentElement.classList.add('kiosk-rotate');

      // 일부 터치스크린은 CSS 회전 전(원래 가로) 좌표를 그대로 보고한다.
      // base.css의 회전 방향(rotate(90deg)/translate(100vw,0))과 짝을 맞춰
      // 클릭 좌표를 보정한다. 방향을 rotate(-90deg)/translate(0,100vh)로
      // 바꿨다면 아래도 cx=e.clientY, cy=vh-e.clientX로 함께 바꿔야 한다.
      document.addEventListener('click', function (e) {
        if (!e.isTrusted) return; // 우리가 아래서 다시 쏘는 클릭은 건너뜀
        var vw = window.innerWidth;
        var cx = vw - e.clientY;
        var cy = e.clientX;
        var real = document.elementFromPoint(cx, cy);
        if (real && real !== e.target) {
          e.preventDefault();
          e.stopPropagation();
          real.click();
        }
      }, true);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/base.css">
  {% block styles %}{% endblock %}
  <style>
    /* Prevent flash of unstyled content */
    body { opacity: 0; transition: opacity 0.3s; }
    body.ready { opacity: 1; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}

  <script>
    // Mark body ready after first paint
    requestAnimationFrame(() => document.body.classList.add('ready'));
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
